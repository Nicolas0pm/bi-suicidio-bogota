name: Construir ejecutable portable (Windows)

on:
  push:
    branches: [main]
    paths: ["escritorio/**", ".github/workflows/construir-exe.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r escritorio/requirements.txt
      - name: Empaquetar con PyInstaller
        working-directory: escritorio
        run: pyinstaller --noconfirm --onefile --windowed --name BI_Suicidio --distpath dist/BI_Suicidio app.py
      - name: Copiar config y LEEME
        working-directory: escritorio
        run: |
          copy config.json dist\BI_Suicidio\config.json
          copy LEEME.txt dist\BI_Suicidio\LEEME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BI_Suicidio_USB
          path: escritorio/dist/BI_Suicidio

  pruebas-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m etl.limpieza && python -m pytest -q
